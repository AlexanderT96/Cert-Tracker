name: Job Market Refresh

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-market-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh UK market feed and rotating role searches
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOB_MARKET_LOCATION: ${{ vars.JOB_MARKET_LOCATION }}
        run: node tools/refresh-job-market.mjs
      - name: Commit refreshed market data
        run: |
          if git diff --quiet -- data/job-market.json; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/job-market.json
          git commit -m "chore: refresh live UK job market"
          git push
