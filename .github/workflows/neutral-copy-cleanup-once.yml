name: One-time neutral copy cleanup

on:
  push:
    branches: [v3.1/ten-out-of-ten-privacy]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[neutral-copy-cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.1/ten-out-of-ten-privacy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/neutral-copy-cleanup.mjs
      - name: Commit cleaned catalogue copy
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certs.js
          git commit -m "v3.1: clean neutral catalogue copy [neutral-copy-cleaned]"
          git push origin HEAD:v3.1/ten-out-of-ten-privacy
